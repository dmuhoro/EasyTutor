name: flake-proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  in-suite:
    name: 20 consecutive full suites
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the in-suite flake proof
        env:
          FLAKE_PROOF_LOG_DIR: ${{ runner.temp }}/flake-proof/runs
        run: bash scripts/qa/flake-proof.sh
      - name: Upload flake-proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-proof-logs
          path: ${{ runner.temp }}/flake-proof/runs
          if-no-files-found: warn
