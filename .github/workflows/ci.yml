name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Readiness register (schema, cycles, evidence, generated file)
        run: npm run readiness:check
      - name: Declared imports (fail on imported-but-undeclared packages)
        run: npm run check:imports
      - name: AI boundary (no disabled direct rail in production)
        run: npm run check:ai-boundary
      - name: TypeScript type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: AGENTS.md suite count is current (fail closed on drift)
        run: grep -q "113 files / 605 tests" AGENTS.md
      - name: Production dependency audit (no critical advisories)
        run: npm audit --omit=dev --audit-level=critical
      - name: Circular dependency check
        run: npm run lint:cycles
      - name: Architecture boundary audit
        run: node scripts/architecture/validate_boundaries.js
      - name: Database governance audit
        run: node scripts/architecture/governance_audit.js
      - name: Secret exposure guard
        run: npm run guard:secret-exposure
      - name: Public env allowlist guard
        run: npm run guard:public-env
      - name: QA runner
        run: node scripts/qa/qa_runner.js
      - name: Install Playwright browser (perf + no-backend smoke)
        run: npx playwright install --with-deps chromium
      - name: Web export
        run: npm run build
      - name: Secret exposure guard (exported bundle)
        run: npm run guard:dist
      - name: Web entry size budget
        run: npm run perf:budget
      - name: Login-route JS transfer ratchet
        run: npm run perf:login-route
      - name: No-backend route/PWA smoke (390px)
        run: npm run e2e:smoke

  real-stack:
    name: Real stack (Supabase CLI + full e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Pin the API port the e2e harness asserts (fail closed on drift)
        run: grep -q '^port = 54331$' supabase/config.toml
      - name: Start local Supabase (no studio/imgproxy)
        run: supabase start -x studio,imgproxy
      - name: Reset database from committed migrations
        run: supabase db reset --no-seed
      - name: Export deterministic local stack env (values are never logged)
        run: |
          source <(supabase status -o env | grep -E '^(API_URL|ANON_KEY|JWT_SECRET)=')
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$JWT_SECRET"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          # Expo inlines EXPO_PUBLIC_* into the bundle at build time. Without these
          # the exported app has no Supabase endpoint and the real sign-up never
          # reaches the stack (observed as a 120 s waitForResponse timeout in CI).
          # The harness still rewrites the embedded http URL to https before the
          # app's https-only guard, exactly as it does locally.
          echo "EXPO_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Web export
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Real-stack e2e walkthrough
        run: npm run e2e:full
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
