name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Declared imports (fail on imported-but-undeclared packages)
        run: npm run check:imports
      - name: AI boundary (no disabled direct rail in production)
        run: npm run check:ai-boundary
      - name: TypeScript type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Circular dependency check
        run: npm run lint:cycles
      - name: Architecture boundary audit
        run: node scripts/architecture/validate_boundaries.js
      - name: Secret exposure guard
        run: npm run guard:secret-exposure
      - name: Public env allowlist guard
        run: npm run guard:public-env
      - name: QA runner
        run: node scripts/qa/qa_runner.js
      - name: Install Playwright browser (perf + no-backend smoke)
        run: npx playwright install --with-deps chromium
      - name: Web export
        run: npm run build
      - name: Secret exposure guard (exported bundle)
        run: npm run guard:dist
      - name: Web entry size budget
        run: npm run perf:budget
      - name: Login-route JS transfer ratchet
        run: npm run perf:login-route
      - name: No-backend route/PWA smoke (390px)
        run: npm run e2e:smoke

  rls-matrix:
    name: RLS matrix (247 assertions, fail closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prove the matrix detects an unhardened baseline
        # Negative control: exits 0 ONLY when the harness rejects the insecure
        # fixture. A vacuous gate that passes both cases must fail this step.
        run: RLS_PROOF_UNHARDENED=1 bash scripts/security/run_rls_matrix_local.sh
      - name: Prove all 247 assertions against the committed migration
        run: bash scripts/security/run_rls_matrix_local.sh
