name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Circular dependency check
        run: npm run lint:cycles
      - name: Architecture boundary audit
        run: node scripts/architecture/validate_boundaries.js
      - name: QA runner
        run: node scripts/qa/qa_runner.js
      - name: Web export
        run: npm run build